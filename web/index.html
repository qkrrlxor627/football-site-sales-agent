<title>PITCHROOM 축구화 상담</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 질문 하나 + 입력창 하나. 뒤에는 축구장과 후보 3켤레가 깔리고, 답할수록 선명해진다. 결과가 나오면 질문 블록이 카드 아래로 내려간다 */
:root {
  --bg: #fbfbfd;
  --surface: #ffffff;
  --tile: #f1f2f5;
  --fg: #1d1d1f;
  --muted: #6b6d75;
  --line: #e2e4ea;
  --pitch: #d7dbe3;
  --accent: #1a73e8;
  --g-blue: #1a73e8;
  --g-red: #d93025;
  --g-yellow: #e8a100;
  --g-green: #188038;
  --sole: #232327;
  --veil: rgba(251, 251, 253, .82);
  --shadow: 0 1px 2px rgba(20, 24, 40, .06), 0 8px 28px rgba(20, 24, 40, .08);
  --font-display: "Manrope", "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f11; --surface: #17181b; --tile: #1d1f23; --fg: #f1f2f4; --muted: #9b9ea6;
    --line: #2a2d33; --pitch: #2b2f36; --accent: #8ab4f8; --g-blue: #8ab4f8; --g-red: #f28b82;
    --g-yellow: #fdd663; --g-green: #81c995; --sole: #0a0a0b; --veil: rgba(14, 15, 17, .8);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 28px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0f11; --surface: #17181b; --tile: #1d1f23; --fg: #f1f2f4; --muted: #9b9ea6;
  --line: #2a2d33; --pitch: #2b2f36; --accent: #8ab4f8; --g-blue: #8ab4f8; --g-red: #f28b82;
  --g-yellow: #fdd663; --g-green: #81c995; --sole: #0a0a0b; --veil: rgba(14, 15, 17, .8);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 28px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 0 32px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; }
.brand { display: flex; align-items: center; gap: 10px; }
.wordmark { font-family: var(--font-display); font-weight: 800; letter-spacing: .14em; font-size: 15px; }
.tag { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.reset { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--muted); }
.reset:hover { color: var(--fg); border-color: var(--muted); }

/* 무대 */
.stage { position: relative; border-radius: 28px; overflow: hidden; isolation: isolate; }
.bg { position: absolute; inset: 0; z-index: -1; background: var(--bg); background-size: cover; background-position: center; transition: opacity .6s ease; }
.bg.photo::after { content: ""; position: absolute; inset: 0; background: var(--veil); }
.pitch { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
.pitch * { stroke: var(--pitch); fill: none; stroke-width: 1.5; }
.stage.has-photo .pitch { display: none; }

.shelf-wrap { padding: 28px 20px 24px; }
.count { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 14px; }
.count b { color: var(--fg); font-size: 15px; }
.shelf {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;
  filter: blur(var(--blur, 12px)) saturate(var(--sat, .7)); opacity: var(--dim, .45);
  transition: filter .7s ease, opacity .7s ease;
}
.shelf.paused { filter: grayscale(1) blur(2px); opacity: .45; }
.card { position: relative; background: var(--tile); border-radius: 22px; padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card.enter { animation: rise .5s ease both; }
.card.best { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.best-label { position: absolute; top: 12px; left: 14px; font-size: 11.5px; font-weight: 700; color: var(--accent); }
.shoe { aspect-ratio: 24 / 13; width: 100%; max-width: 100%; margin: 8px 0 4px; }
.shoe img, .shoe svg { width: 100%; height: 100%; object-fit: contain; display: block; }
.shoe img { mix-blend-mode: multiply; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .shoe img { mix-blend-mode: normal; border-radius: 14px; } }
:root[data-theme="dark"] .shoe img { mix-blend-mode: normal; border-radius: 14px; }
.meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.stud { font-family: var(--font-display); font-weight: 800; font-size: 11.5px; letter-spacing: .06em; padding: 2px 8px; border-radius: 6px; background: var(--surface); }
.code { font-size: 11.5px; color: var(--muted); }
.name { font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.3; text-wrap: balance; }
.price { font-family: var(--font-display); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.why { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.trade { display: flex; flex-direction: column; gap: 4px; }
.trade span { font-size: 12.5px; line-height: 1.4; padding: 4px 8px; border-radius: 8px; color: var(--fg); background: color-mix(in srgb, var(--g-yellow) 14%, transparent); }
.card.empty { background: none; border: 1.5px dashed var(--line); align-items: center; justify-content: center; text-align: center; min-height: 240px; color: var(--muted); font-size: 13px; }

/* CS 카드뉴스 (축구화 자리에 뜬다) */
.news { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
.slide { flex: 1 0 220px; min-height: 280px; scroll-snap-align: start; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.slide .step { display: flex; justify-content: space-between; font-family: var(--font-display); font-weight: 800; font-size: 12px; letter-spacing: .08em; }
.slide .step em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
.slide h3 { margin: 0; font-family: var(--font-display); font-size: 19px; line-height: 1.35; text-wrap: balance; }
.slide p, .slide li { font-size: 13.5px; margin: 0; }
.slide ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.slide .ag { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.slide[data-s="1"] { background: color-mix(in srgb, var(--g-blue) 9%, var(--surface)); }
.slide[data-s="1"] .step { color: var(--g-blue); }
.slide[data-s="2"] .step { color: var(--g-green); }
.slide[data-s="3"] .step { color: var(--g-red); }
.slide[data-s="4"] .step { color: var(--g-yellow); }
.verdict { align-self: flex-start; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.verdict.ok { color: var(--g-green); background: color-mix(in srgb, var(--g-green) 13%, transparent); }
.verdict.hold { color: var(--g-yellow); background: color-mix(in srgb, var(--g-yellow) 16%, transparent); }
.alt-list { margin: 0; padding-left: 18px; font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }

/* 질문 블록: 수집 중엔 카드 위에 겹치고, 결과가 나오면 카드 아래로 */
.ask { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 24px 16px 28px; }
.stage.collect .ask {
  position: absolute; inset: 0; justify-content: center;
  background: radial-gradient(ellipse at center, var(--veil) 35%, transparent 80%);
}
.echo { margin: 0; font-size: 13px; color: var(--muted); max-width: 600px; overflow-wrap: anywhere; }
.q { margin: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: -.02em; line-height: 1.3; text-wrap: balance; max-width: 760px; font-size: clamp(22px, 3.4vw, 34px); }
.q.long { font-size: clamp(19px, 2.4vw, 24px); font-weight: 600; }
.search { display: flex; align-items: center; gap: 8px; width: min(600px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 20px; box-shadow: var(--shadow); }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; padding-block: 8px; }
.send { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
.send svg { width: 18px; height: 18px; }
.send[aria-busy="true"] { opacity: .4; }

.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.slots span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.slots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.slots b { font-weight: 600; color: var(--fg); }
.slots [data-k="surface"].on i { background: var(--g-blue); }
.slots [data-k="width"].on i { background: var(--g-red); }
.slots [data-k="size"].on i { background: var(--g-yellow); }
.slots [data-k="budget"].on i { background: var(--g-green); }
.slots [data-k="style"].on i { background: var(--fg); }

details.discuss { width: min(600px, 100%); text-align: left; font-size: 13px; }
details.discuss summary { list-style: none; cursor: pointer; color: var(--muted); text-align: center; }
details.discuss summary::-webkit-details-marker { display: none; }
details.discuss summary:hover { color: var(--fg); }
.dlist { list-style: none; margin: 10px 0 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.dlist li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.agent { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; color: var(--muted); background: var(--tile); }
.agent[data-a="접수 에이전트"] { color: var(--g-blue); background: color-mix(in srgb, var(--g-blue) 12%, transparent); }
.agent[data-a="피팅 에이전트"] { color: var(--g-green); background: color-mix(in srgb, var(--g-green) 12%, transparent); }
.agent[data-a="정책 에이전트"] { color: var(--g-red); background: color-mix(in srgb, var(--g-red) 12%, transparent); }
.agent[data-a="재고 에이전트"], .agent[data-a="검색 에이전트"] { color: var(--g-yellow); background: color-mix(in srgb, var(--g-yellow) 16%, transparent); }
.locked { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.locked svg { width: 13px; height: 13px; flex: none; }

.handoff { width: min(600px, 100%); text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
.handoff strong { font-family: var(--font-display); font-size: 15px; }
.foot { font-size: 12px; color: var(--muted); padding-top: 14px; }
.who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pill-btn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--fg); }
.pill-btn:hover { border-color: var(--muted); }
.pill-btn.dark { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.me { font-size: 13px; font-weight: 600; }
.panel { margin-bottom: 16px; border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-size: 17px; }
.panel p { margin: 0; font-size: 13.5px; color: var(--muted); }
.login-row { display: flex; gap: 8px; flex-wrap: wrap; }
.login-row input { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--bg); font-size: 15px; }
.demo-ids { width: 100%; border-collapse: collapse; font-size: 13px; }
.demo-ids td { padding: 6px 4px; border-top: 1px solid var(--line); }
.demo-ids td:first-child { font-family: var(--font-display); font-weight: 700; width: 90px; user-select: all; }
.orders { display: flex; flex-direction: column; gap: 10px; }
.order { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; padding: 10px; border-radius: 16px; background: var(--tile); }
.order .thumb { aspect-ratio: 24 / 13; width: 100%; }
.order .thumb img, .order .thumb svg { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.order .info { min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.order .info b { font-family: var(--font-display); font-size: 14px; }
.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.steps span { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; color: var(--muted); background: var(--surface); }
.steps span.done { color: var(--fg); }
.steps span.now { color: var(--bg); background: var(--fg); font-weight: 700; }
.steps span.svc { color: var(--g-red); background: color-mix(in srgb, var(--g-red) 12%, transparent); font-weight: 700; }
.buy { margin-top: 6px; align-self: flex-start; border: 0; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; background: var(--fg); color: var(--bg); }
.card .steps { margin-top: 2px; }
.order-note { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.switch { background: none; border: 0; padding: 4px 2px; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.switch:hover { color: var(--fg); }
.sheet { width: min(600px, 100%); text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 16px 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.sheet strong { flex: 1 1 200px; font-family: var(--font-display); }
.sheet select { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); font-size: 14px; }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (max-width: 760px) {
  .shelf { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 78%; overflow-x: auto; scroll-snap-type: x mandatory; }
  .card { scroll-snap-align: start; }
  .shelf-wrap { padding: 20px 12px; }
  .stage.collect .ask { position: static; background: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

const REDUCERS = { messages: (a, b) => a.concat(b), discussion: (a, b) => a.concat(b) };

// 노드가 반환한 부분 dict를 State에 합친다 (LangGraph의 병합 규칙)
function merge(state, update) {
  if (!update) return state;
  const next = { ...state };
  for (const [k, v] of Object.entries(update)) {
    next[k] = REDUCERS[k] ? REDUCERS[k](state[k], v) : v;
  }
  return next;
}

const say = (agent, text, visibility = 'public') => ({ agent, text, visibility, turn: null });

/* ---------------- 추출 (데모에서는 규칙, 실제로는 LLM 구조화 출력) ---------------- */
function extract(text) {
  const t = text.replace(/\s+/g, ' ');
  const out = {};
  if (/흙|맨땅|마사토|모래/.test(t) || (/운동장/.test(t) && !/잔디|인조|천연/.test(t))) out.surface = '흙운동장';
  else if (/천연/.test(t)) out.surface = '천연잔디';
  else if (/인조/.test(t)) out.surface = '인조잔디';
  else if (/풋살/.test(t)) out.surface = '풋살장';
  else if (/실내|체육관|강당/.test(t)) out.surface = '실내';

  if (/칼발|좁/.test(t)) out.width = '좁음';
  else if (/넓|발볼이 커|발볼 큰|볼이 커/.test(t)) out.width = '넓음';
  else if (/보통|평범|중간/.test(t) && /발|볼|편/.test(t)) out.width = '보통';

  const mm = t.match(/(2[2-9]\d)\s*(mm|미리|사이즈|신어|신고|이요|요|$|\s)/);
  if (mm) {
    const n = Number(mm[1]);
    if (n >= 220 && n <= 300) out.size = Math.round(n / 5) * 5;
  }

  const man = t.match(/(\d{1,3})\s*만\s*원?/);
  const won = t.match(/(\d{2,3})[,.]?000\s*원/);
  if (man) out.budget = Number(man[1]) * 10000;
  else if (won) out.budget = Number(won[1]) * 1000;
  else if (/상관\s*없|무관|제한\s*없/.test(t) && /예산|가격|돈|상관/.test(t)) out.budget = Infinity;

  const pl = PLAYER_LINE.find((x) => x.re.test(t));
  const st = STYLE_LINE.find((x) => x.re.test(t));
  if (pl) out.style = { line: pl.line, why: pl.why, source: `선수: ${pl.who} (${pl.boot})` };
  const br = BRAND_RE.find(([re]) => re.test(t));
  if (br) out.brand = br[1];
  else if (st) out.style = { line: st.line, why: st.why, source: '플레이 스타일' };
  return out;
}

function classifyIntent(text) {
  if (/배송|언제\s*와|도착|출고|택배|주문.*(어디|언제)|어디쯤/.test(text)) return '배송';
  if (/반품|환불/.test(text)) return '반품';
  if (/교환|바꾸|바꿔|작아|작네|작은 것 같|커요|커서|헐렁|꽉 껴|끼어|안 맞/.test(text)) return '교환';
  return '상담';
}

function extractCs(text) {
  const out = {};
  const d = text.match(/(\d{1,2})\s*일/);
  if (d) out.days = Number(d[1]);
  else if (/오늘/.test(text)) out.days = 0;
  else if (/어제/.test(text)) out.days = 1;
  else if (/그저께|그제/.test(text)) out.days = 2;
  else if (/일주일|한 주/.test(text)) out.days = 7;
  else if (/2주|이주|한 달|한달/.test(text)) out.days = 14;

  if (/안\s*신|미착용|실내에서만|집에서만|택\s*(그대로|안 뗐)|신어만/.test(text)) out.worn = false;
  else if (/신고|신었|착용|경기|뛰었|밖에서|훈련/.test(text)) out.worn = true;

  if (/두\s*번|2번|또\s|또 교환|다시 교환|한 번 더/.test(text)) out.repeat = true;
  return out;
}

function normalizeLLM(x) {
  if (!x || typeof x !== 'object' || Array.isArray(x)) return null;
  const pick = (v, list) => (list.includes(v) ? v : null);
  const short = (v, n) => (v == null ? null : String(v).slice(0, n));
  const out = { got: {}, intent: pick(x.intent, ['상담', '배송', '교환', '반품']), health: x.health_flag === true, cs: {}, notes: [] };
  const surf = pick(x.surface, Object.keys(SURFACE_TO_STUD));
  if (surf) out.got.surface = surf;
  const w = pick(x.width, ['좁음', '보통', '넓음']);
  if (w) out.got.width = w;
  const b = Number(x.budget);
  if (x.budget === 'none') out.got.budget = Infinity;
  else if (x.budget != null && Number.isFinite(b) && b >= 10000 && b <= 3000000) out.got.budget = Math.round(b);
  const z = Number(x.size);
  if (x.size != null && Number.isFinite(z) && z >= 220 && z <= 310) out.got.size = Math.round(z / 5) * 5;
  if (x.brand) out.got.brand = short(x.brand, 20);
  const line = pick(x.style_line, LINES);
  if (line) {
    const player = short(x.player, 20);
    out.got.style = { line, why: short(x.style_why, 40) || '', source: player ? `선수: ${player}${x.player_boot ? ` (${short(x.player_boot, 30)})` : ''}` : '취향' };
  }
  if (x.cs && typeof x.cs === 'object') {
    const d = Number(x.cs.days);
    if (x.cs.days != null && Number.isFinite(d) && d >= 0 && d < 400) out.cs.days = Math.round(d);
    if (x.cs.worn === true || x.cs.worn === false) out.cs.worn = x.cs.worn;
    if (x.cs.repeat === true) out.cs.repeat = true;
  }
  if (Array.isArray(x.other_requests)) out.notes = x.other_requests.slice(0, 3).map((n) => short(n, 30)).filter(Boolean);
  return out;
}

/* ---------------- 규칙 필터 ---------------- */
function filterProducts(p) {
  return PRODUCTS.filter((s) => {
    if (p.surface && !SURFACE_TO_STUD[p.surface].includes(s.stud)) return false;
    if (p.width && s.width !== p.width) return false;
    if (p.budget != null && s.price > p.budget) return false;
    return true;
  });
}

// 대체 스터드 (구장별로 '안전하게' 바꿔 쓸 수 있는 것만, 값 = 양보 점수). 전문가 검토 대상 규칙
const SUBSTITUTE = {
  천연잔디: { HG: 0.5, AG: 0.6, TF: 0.9 },
  인조잔디: { HG: 0.7 },
  흙운동장: { AG: 0.6 },
  풋살장: { AG: 0.8 },
  실내: { TF: 0.8 },
};
const SUB_NOTE = {
  천연잔디: { HG: '맨땅용 HG, 단단한 잔디에서도 사용 가능', AG: '인조잔디용 AG, 마른 천연잔디에서 사용 가능', TF: '터프화 TF, 잔디에선 접지가 약함' },
  인조잔디: { HG: '맨땅용 HG, 인조잔디에서도 사용 가능' },
  흙운동장: { AG: '인조잔디용 AG, 흙에선 스터드가 빨리 닳음' },
  풋살장: { AG: '인조잔디용 AG, 풋살장에선 스터드가 길게 느껴질 수 있음' },
  실내: { TF: '터프화 TF, 실내 바닥에선 접지 확인 필요' },
};

// 조건을 전부 맞추는 신발이 없을 때: 양보 점수가 낮은 순
function nearest(p) {
  const out = [];
  for (const s of PRODUCTS) {
    let cost = 0;
    const trade = [];
    if (p.surface && !SURFACE_TO_STUD[p.surface].includes(s.stud)) {
      const c = (SUBSTITUTE[p.surface] || {})[s.stud];
      if (c == null) continue; // 위험한 대체는 후보에서 제외
      cost += c;
      trade.push((SUB_NOTE[p.surface] || {})[s.stud] || `${s.stud} 대체`);
    }
    if (p.budget != null && p.budget !== Infinity && s.price > p.budget) {
      cost += (s.price - p.budget) / 100000;
      trade.push(`예산보다 ${won(s.price - p.budget)} 높음`);
    }
    if (p.width && s.width !== p.width) {
      cost += 1;
      trade.push(`발볼 ${s.width} (매장 시착 권장)`);
    }
    if (p.size && stockOf(s.code, p.size) === 0) {
      const alt = SIZES.filter((z) => Math.abs(z - p.size) === 5 && stockOf(s.code, z) > 0);
      cost += alt.length ? 0.8 : 1.5;
      trade.push(alt.length ? `${p.size}mm 품절, ${alt.join('·')}mm 재고 있음` : `${p.size}mm 입고 대기`);
    }
    out.push({ p: s, cost, trade });
  }
  return out.sort((a, b) => a.cost - b.cost || a.p.price - b.p.price);
}

// 정보가 덜 모였을 때도 화면 뒤 카드 3개를 보여주기 위한 정렬
function rank(list, p) {
  return [...list].sort((a, b) => {
    const sa = p.budget != null && p.budget !== Infinity ? -a.price / p.budget : 0;
    const sb = p.budget != null && p.budget !== Infinity ? -b.price / p.budget : 0;
    const boost = (s) => (p.style && s.line === p.style.line ? 100 : 0);
    return boost(b) - boost(a) || sb - sa || a.price - b.price;
  });
}

function whyKept(s, p) {
  const bits = [];
  if (p.surface) bits.push(`${p.surface} → ${s.stud}`);
  if (p.width) bits.push(`발볼 ${s.width}`);
  if (p.budget != null && p.budget !== Infinity) bits.push(`예산 안 ${won(s.price)}`);
  return bits.length ? bits.join(' · ') : s.feel;
}

const won = (n) => (n === Infinity ? '상관없음' : `${Math.round(n / 1000).toLocaleString('ko-KR')},000원`);

/* ---------------- 노드 ---------------- */
// ① 접수: 메시지 기록 + 정보 추출
function intakeNode(state, text, llm) {
  const got = { ...extract(text), ...(llm ? llm.got : {}) };
  const profile = { ...state.profile };
  const filled = [];
  if (got.size) profile.size = got.size;
  for (const k of SLOT_ORDER) {
    if (got[k] !== undefined && got[k] !== null) {
      profile[k] = got[k];
      filled.push(k);
    }
  }
  if (got.size) filled.push('size');
  const disc = filled.length
    ? [say('접수 에이전트', `${filled.map((k) => `${SLOT_LABEL[k]}: ${k === 'budget' ? won(profile[k]) : k === 'size' ? profile[k] + 'mm' : profile[k]}`).join(', ')} 확인했어요.`)]
    : [];
  if (llm) disc.unshift(say('접수 에이전트', 'Claude가 문장을 읽고 조건을 정리했어요. 판단은 아래 규칙이 해요.'));
  if (got.style) {
    profile.style = got.style;
    disc.push(say('접수 에이전트', `취향 신호: ${got.style.source} → 우리 매장에선 ${got.style.line} 라인이 가장 가까워요${got.style.why ? ` (${got.style.why})` : ''}.`));
    if (got.style.source.startsWith('선수')) disc.push(say('검색 에이전트', '선수 장비는 바뀔 수 있어서, 실서비스에서는 Tavily로 최신 정보를 확인해요.'));
  }
  let notice = null;
  if (got.brand) {
    profile.brand = got.brand;
    if (!CARRIED_BRANDS.includes(got.brand)) {
      notice = `${got.brand}는 취급하지 않아서, 나이키에서 가장 비슷한 쪽으로 골라 드릴게요.`;
      disc.push(say('피팅 에이전트', `${got.brand} 요청이에요. 매장에 없는 브랜드라 억지로 거절하지 않고, 나이키 대안으로 갈게요.`));
      disc.push(say('재고 에이전트', `${got.brand} 입점 문의로 집계(내부).`, 'internal'));
    }
  }
  if (llm && llm.notes.length) disc.push(say('접수 에이전트', `규칙에 없는 요청은 참고로만 기록해요: ${llm.notes.join(', ')}`));
  return { messages: [{ role: 'user', text }], profile, discussion: disc, missed: !filled.length && !got.style && !got.brand, notice, turn: state.turn + 1 };
}

// ② 안전 가드: 발 건강 언급은 무조건 사람에게 (규칙)
function guardNode(state, text, llm) {
  const hit = RED_FLAGS.find((w) => text.includes(w)) || (llm && llm.health ? '발 건강' : null);
  if (!hit) return null;
  return {
    route: 'escalate',
    reason: 'health',
    discussion: [
      say('접수 에이전트', `"${hit}" 관련 언급이 있어요. 발 건강은 AI가 판단하지 않아요.`),
      say('피팅 에이전트', '이 경우 추천을 멈추고 전문가 상담으로 넘길게요.'),
      say('정책 에이전트', '건강 관련 건은 상담 이력에 별도 표시 후 매니저 배정(내부 SLA 2시간).', 'internal'),
    ],
  };
}

// ③ 분류: 상담인지 CS인지 (실제로는 LLM, 선택지는 Literal로 제한)
function classifyNode(state, text, llm) {
  const intent = state.cs.waiting ? state.cs.topic : (llm && llm.intent) || classifyIntent(text);
  return { intent };
}

// ④-a CS: 로그인했으면 주문 기록으로, 아니면 고객에게 물어서 정책 규칙으로 판단
const daysSince = (iso) => Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 864e5));
const orderLabel = (o) => {
  const p = PRODUCTS.find((x) => x.code === o.code);
  return `${p ? p.name + ' ' + p.stud : o.code} ${o.size}mm`;
};
const IN_SERVICE = ['교환 접수', '반품 접수', '사장님 확인 중'];

function csNode(state, text, llm) {
  const cs = { ...state.cs, topic: state.intent, ...extractCs(text), ...(llm ? llm.cs : {}) };
  const d = [];
  const acc = state.account;
  const orders = acc ? acc.orders : [];

  if (cs.topic === '배송') {
    d.push(say('접수 에이전트', '배송 일정 문의로 분류했어요.'));
    d.push(say('정책 에이전트', '택배사 지연 시 보상 쿠폰 발급 기준(내부).', 'internal'));
    const rules = [`${POLICY.shipCutoff} 이전 결제 → 당일 출고`, '출고 후 1~2일 내 도착 (도서산간 +1~2일)', '주말·공휴일은 출고 없음'];
    let summary = '주문한 축구화가 언제 도착하나요?';
    let next;
    if (!acc) {
      d.push(say('정책 에이전트', '로그인 전이라 주문을 특정할 수 없어요. 일반 배송 기준으로 안내할게요.'));
      next = `${POLICY.shipCutoff} 전 결제는 당일 출고되고 보통 1~2일 뒤 도착해요. 로그인하면 주문별로 알려 드려요.`;
    } else {
      const open = orders.filter((o) => o.status === '결제완료' || o.status === '배송중');
      d.push(say('정책 에이전트', `${acc.name}님 주문 ${orders.length}건 중 배송 진행 중인 건 ${open.length}건이에요.`));
      if (!open.length) {
        const last = orders.find((o) => o.deliveredAt);
        next = last ? `진행 중인 배송은 없어요. 최근 주문 ${orderLabel(last)}은 ${daysSince(last.deliveredAt)}일 전에 배송 완료됐어요.` : '진행 중인 주문이 없어요.';
      } else {
        const o = open[0];
        summary = `${acc.name}님 · ${o.id} · ${orderLabel(o)}`;
        next = o.status === '결제완료'
          ? `${orderLabel(o)} 주문(${o.id})은 결제 완료, 출고 준비 중이에요. ${POLICY.shipCutoff} 전 결제분은 당일 출고돼요.`
          : `${orderLabel(o)} 주문(${o.id})은 ${daysSince(o.shippedAt) === 0 ? '오늘' : `${daysSince(o.shippedAt)}일 전`} 출고돼 배송 중이에요. 보통 출고 후 1~2일 안에 도착해요.`;
      }
      d.push(say('검수 에이전트', '택배사 상황이 있어서 도착 날짜를 확정해 약속하지 않도록 했어요.'));
    }
    return { cs: { ...cs, waiting: false }, route: 'cs', reason: 'auto', discussion: d, csCard: { summary, rules, verdict: '자동 답변', next } };
  }

  // 교환·반품
  let order = null;
  if (acc) {
    const busy = orders.find((o) => IN_SERVICE.includes(o.status));
    if (busy && !state.cs.waiting) {
      d.push(say('정책 에이전트', `${busy.id} 주문은 이미 사후 서비스가 진행 중이에요. 새로 접수하지 않고 진행 상황을 알려 드릴게요.`));
      return {
        cs: { ...cs, waiting: false }, route: 'cs', reason: 'status', discussion: d,
        csCard: { summary: `${acc.name}님 · ${busy.id} · ${orderLabel(busy)}`, rules: ['진행 중인 교환·반품이 있으면 중복 접수하지 않음'], verdict: busy.status, next: `${orderLabel(busy)}은 지금 "${busy.status}" 상태예요.${busy.note ? ' ' + busy.note : ''}` },
      };
    }
    order = orders.filter((o) => o.status === '배송완료').sort((a, b) => Date.parse(b.deliveredAt) - Date.parse(a.deliveredAt))[0];
    if (!order) {
      d.push(say('정책 에이전트', '배송 완료된 주문이 없어요. 교환·반품은 받은 뒤에 신청할 수 있어요.'));
      return {
        cs: { ...cs, waiting: false }, route: 'cs', reason: 'no-order', discussion: d,
        csCard: { summary: `${acc.name}님 · ${cs.topic} 문의`, rules: ['교환·반품은 배송 완료 후 신청'], verdict: '안내', next: '배송 완료된 주문이 아직 없어요. 상품을 받은 뒤 다시 말씀해 주세요.' },
      };
    }
    cs.days = daysSince(order.deliveredAt);
    cs.repeat = order.exchanges > 0;
    d.push(say('정책 에이전트', `${order.id} 주문 기록에서 수령 ${cs.days}일째, 교환 이력 ${order.exchanges}회를 확인했어요.`));
  }

  const missing = [];
  if (cs.days == null) missing.push('받으신 지 며칠 되셨나요?');
  if (cs.worn == null && !(cs.days != null && cs.days > POLICY.returnDays)) missing.push('실외 구장에서 신으셨나요, 실내에서 신어보기만 하셨나요?'); // 기간이 지났으면 착용 여부와 상관없이 결과가 같아 묻지 않음
  if (missing.length && !state.cs.waiting) {
    d.unshift(say('접수 에이전트', `${cs.topic} 문의로 분류했어요.`));
    d.push(say('정책 에이전트', acc ? '착용 여부는 기록에 없어서 고객에게 물어볼게요.' : '수령일과 착용 여부를 알아야 판단할 수 있어요.'));
    return { cs: { ...cs, waiting: true }, route: 'ask', reason: 'cs-info', discussion: d, reply: missing.join(' ') + (acc ? '' : ' 로그인하면 주문 기록으로 바로 확인해요.') };
  }

  const inPeriod = cs.days != null && cs.days <= POLICY.returnDays;
  const unworn = cs.worn === false;
  const rules = [
    `수령 후 ${POLICY.returnDays}일 이내 ${cs.days == null ? '(확인 안 됨)' : inPeriod ? `✓ ${cs.days}일째` : `✗ ${cs.days}일째`}`,
    `실외 미착용 ${cs.worn == null ? '(확인 안 됨)' : unworn ? '✓' : '✗ 스터드 사용 흔적'}`,
  ];
  if (cs.topic === '교환') rules.push(`사이즈 교환 ${POLICY.freeExchange}회 무료 ${cs.repeat ? '✗ 이미 교환 이력' : '✓'}`);
  else rules.push(`단순 변심 반품 왕복 배송비 ${won(POLICY.returnFee)} 고객 부담`);

  const auto = inPeriod && unworn && !(cs.topic === '교환' && cs.repeat);
  d.push(say('정책 에이전트', auto ? '조건을 모두 충족해서 자동 접수할게요.' : '규칙 밖이라 제가 약속할 수 없어요. 사장님 결재로 넘길게요.'));
  if (!auto) d.push(say('정책 에이전트', '착용품 재판매 불가 시 손실액 기준 결재 라인(내부).', 'internal'));
  if (cs.topic === '교환') {
    d.push(say('피팅 에이전트', cs.repeat ? '같은 모델로 교환이 반복되면 사이즈보다 발 모양 문제일 수 있어요. 피팅 상담을 같이 제안할게요.' : '교환 사이즈는 평소 운동화보다 5mm 크게 고르는 경우가 많아요.'));
    d.push(say('재고 에이전트', '교환 사이즈 재고 확인, 대체 모델 마진 비교(내부).', 'internal'));
  }
  d.push(say('검수 에이전트', '내부 기준과 금액은 빼고, 고객이 할 수 있는 다음 단계만 남겼어요.'));

  const update = {};
  if (order) {
    const status = auto ? (cs.topic === '교환' ? '교환 접수' : '반품 접수') : '사장님 확인 중';
    const note = auto ? (cs.topic === '교환' ? '회수 기사님이 1~2일 안에 방문해요.' : '회수 후 검수되면 환불돼요.') : '평일 10:00–18:00에 사장님이 확인해요.';
    update.account = { ...acc, orders: orders.map((o) => (o.id === order.id ? { ...o, status, note, exchanges: auto && cs.topic === '교환' ? o.exchanges + 1 : o.exchanges } : o)) };
    d.push(say('접수 에이전트', `${order.id} 주문 상태를 "${status}"로 바꿨어요.`));
  }

  return {
    ...update,
    cs: { ...cs, waiting: false },
    route: auto ? 'cs' : 'escalate',
    reason: auto ? 'auto' : 'policy',
    discussion: d,
    csCard: {
      summary: `${order ? `${acc.name}님 · ${order.id} · ${orderLabel(order)} · ` : ''}${cs.topic} 요청 · 수령 ${cs.days == null ? '?' : cs.days}일째 · ${cs.worn == null ? '착용 여부 미확인' : unworn ? '실외 미착용' : '실외 착용'}${cs.repeat ? ' · 교환 이력 있음' : ''}`,
      rules,
      verdict: auto ? '자동 접수' : '사장님 확인',
      next: auto
        ? cs.topic === '교환'
          ? '교환 접수 완료. 회수 기사님이 1~2일 안에 방문해요. 새 사이즈는 회수 확인 후 바로 출고돼요.'
          : `반품 접수 완료. 회수 후 검수되면 왕복 배송비 ${won(POLICY.returnFee)}을 뺀 금액이 환불돼요.`
        : '사장님이 확인 중이에요. 아래 방법 중 원하시는 걸 말씀해 주시면 그 기준으로 검토해요.',
      options: auto ? null : cs.topic === '교환' ? ['피팅 상담 후 다른 모델로 교환', '같은 모델 다른 사이즈 (예외 승인 요청)', '수선·보상 쿠폰 문의'] : ['예외 반품 요청', '같은 가격대 다른 모델로 교환', '중고 매입 상담'],
    },
  };
}

// ④-b 상담: 규칙 필터 → 빈칸 되묻기 / 추천 / 후보 0개 에스컬레이션
function consultNode(state) {
  const p = state.profile;
  const asked = { ...state.asked };
  const skipped = [...state.skipped];
  const list = filterProducts(p);
  const ranked = rank(list, p);
  const d = [];

  if (p.surface) d.push(say('피팅 에이전트', `${p.surface}이면 ${SURFACE_TO_STUD[p.surface].join('·')}만 남길게요. ${PRODUCTS.length}종 → ${filterProducts({ surface: p.surface, width: null, size: null, budget: null }).length}종.`));
  if (p.style) {
    const has = list.some((s) => s.line === p.style.line);
    d.push(say('피팅 에이전트', has ? `${p.style.line} 라인을 앞에 둘게요. 구장·예산 조건은 그대로 지켜요.` : `${p.style.line} 라인 중에는 지금 조건에 맞는 신발이 없어요. 조건을 어기지 않고 다른 라인으로 보여드릴게요.`));
  }

  if (list.length === 0) {
    // 전부 맞는 신발이 없으면 '가장 가까운 3켤레'를 양보 항목과 함께 추천한다
    const near = nearest(p);
    if (near.length) {
      const top = near.slice(0, 3);
      d.push(say('피팅 에이전트', '조건을 전부 맞추는 신발은 없어요. 안전한 대체 스터드, 예산 초과, 발볼 차이만 허용해서 가장 가까운 순서로 골랐어요.'));
      d.push(say('피팅 에이전트', `1순위 ${top[0].p.name} ${top[0].p.stud}: ${top[0].trade.join(', ')}`));
      d.push(say('재고 에이전트', '같은 조건 문의가 쌓이면 입고를 검토하도록 사장님께 기록했어요.'));
      d.push(say('재고 에이전트', '해당 조건 매입 단가·발주 수량 검토(내부).', 'internal'));
      d.push(say('검수 에이전트', '천연잔디 외 구장에 FG를 권하는 것처럼 위험한 대체는 뺐어요.'));
      const tradeoffs = {};
      top.forEach((x) => { tradeoffs[x.p.code] = x.trade; });
      return { candidates: top.map((x) => x.p.code), pool: 0, route: 'alternative', reason: 'nearest', tradeoffs, discussion: d };
    }
    d.push(say('피팅 에이전트', '안전하게 대체할 수 있는 신발도 없어요. 사람이 판단해야 해요.'));
    d.push(say('검수 에이전트', '사장님께 넘깁니다.'));
    return { candidates: [], pool: 0, route: 'escalate', reason: 'empty', discussion: d, alts: ['입고 알림 신청', '매장 방문 시착 상담'] };
  }

  const next = SLOT_ORDER.find((k) => p[k] == null && !skipped.includes(k));
  if (next && asked[next] < MAX_ASK) {
    asked[next] += 1;
    return { candidates: ranked.slice(0, 3).map((s) => s.code), pool: list.length, asked, route: 'ask', reason: next, discussion: d };
  }
  if (next) skipped.push(next); // 두 번 물어도 비면 그 조건 없이 진행

  const remaining = SLOT_ORDER.find((k) => p[k] == null && !skipped.includes(k));
  if (remaining) {
    asked[remaining] += 1;
    return { candidates: ranked.slice(0, 3).map((s) => s.code), pool: list.length, asked, skipped, route: 'ask', reason: remaining, discussion: d };
  }

  const top = ranked.slice(0, 3);
  const tradeoffs = {};
  if (top.length < 3) {
    // 딱 맞는 신발이 3켤레보다 적으면, 남는 자리는 가장 가까운 대안으로 채운다
    const extra = nearest(p).filter((x) => x.trade.length && !top.includes(x.p)).slice(0, 3 - top.length);
    extra.forEach((x) => { top.push(x.p); tradeoffs[x.p.code] = x.trade; });
    if (extra.length) d.push(say('피팅 에이전트', `딱 맞는 건 ${list.length}켤레라, 나머지 자리는 양보할 점을 적은 대안으로 채웠어요.`));
  } else {
    d.push(say('피팅 에이전트', `조건을 모두 통과한 ${list.length}종 중 취향과 예산에 맞는 순서로 3개 골랐어요.`));
  }
  d.push(say('검수 에이전트', '추천 문장에 후보 밖 상품이 없는지 확인했어요.'));
  return { candidates: top.map((s) => s.code), pool: list.length, asked, skipped, route: 'recommend', reason: null, tradeoffs, discussion: d };
}

// ⑤ 검수: 최종 답변이 후보 밖 상품을 말하지 않는지 (규칙)
function reviewNode(state, replyCodes) {
  const bad = replyCodes.filter((c) => !state.candidates.includes(c));
  return bad.length ? { route: 'escalate', reason: 'review' } : null;
}

/* ---------------- 그래프 실행 ---------------- */
const ASK_TEXT = {
  surface: '어떤 구장에서 주로 뛰세요? 천연잔디, 인조잔디, 흙운동장, 풋살장, 실내 중에 알려 주세요.',
  width: '발볼은 어떤 편이에요? 좁은 편, 보통, 넓은 편 중에 알려 주세요.',
  size: '평소 운동화 사이즈가 몇 mm예요?',
  budget: '예산은 어느 정도 생각하세요? 상관없으면 상관없다고 해 주세요.',
};

function run(state, text, llm = null) {
  let s = { ...state, csCard: null, alts: null, reply: null, tradeoffs: null, notice: null };
  const turnStart = s.discussion.length;
  s = merge(s, intakeNode(s, text, llm));

  const g = guardNode(s, text, llm);
  if (g) s = merge(s, g);
  else {
    s = merge(s, classifyNode(s, text, llm));
    if (s.intent === '상담') s = merge(s, consultNode(s));
    else s = merge(s, csNode(s, text, llm));
  }

  if (s.route === 'recommend') {
    const r = reviewNode(s, s.candidates);
    if (r) s = merge(s, r);
  }

  // 답변 문장 (실제로는 LLM이 State를 보고 작성)
  let reply = s.reply;
  if (!reply) {
    if (s.route === 'ask' && ASK_TEXT[s.reason]) {
      const filled = SLOT_ORDER.filter((k) => s.profile[k] != null).length;
      reply = (s.missed && s.reason !== 'cs-info' ? '조건을 찾지 못했어요. ' : '') + (filled ? `지금 조건으로 ${s.pool}종이 남았어요. ` : '') + ASK_TEXT[s.reason];
    } else if (s.route === 'recommend') {
      const top = s.candidates.map((c) => PRODUCTS.find((x) => x.code === c));
      const lead = s.pool >= 3 ? `조건에 맞는 ${s.pool}종 중 3켤레를 골랐어요.` : `딱 맞는 건 ${s.pool}켤레라, 나머지는 가장 가까운 대안으로 채웠어요.`;
      reply = `${lead} 가장 먼저 신어볼 만한 건 ${top[0].name} ${top[0].stud}예요. ${top[0].feel}.`;
      if (s.profile.style && top[0].line !== s.profile.style.line) {
        const liked = top.find((x) => x.line === s.profile.style.line);
        reply += liked ? ` 좋아하시는 ${s.profile.style.line}는 대안으로 ${liked.name} ${liked.stud}를 넣었어요.` : ` 좋아하시는 ${s.profile.style.line} 라인에는 이 조건에 맞는 모델이 없어요.`;
      }
    } else if (s.route === 'alternative') {
      const top = s.candidates.map((c) => PRODUCTS.find((x) => x.code === c));
      reply = `조건을 전부 맞추는 신발은 없어서, 가장 가까운 ${top.length}켤레를 골랐어요. 1순위는 ${top[0].name} ${top[0].stud}예요. (양보: ${s.tradeoffs[top[0].code].join(' · ')})`;
    } else if (s.route === 'cs') {
      reply = s.csCard.next;
    } else if (s.route === 'escalate') {
      if (s.reason === 'health') reply = '발 건강과 관련된 부분은 제가 판단하지 않고 피팅 전문가에게 연결해 드릴게요. 상담 전까지 추천은 잠시 멈춰 둘게요.';
      else if (s.reason === 'empty') reply = '지금 조건을 모두 맞추는 축구화가 없어요. 억지로 추천하지 않고, 사장님께 아래 대안과 함께 전달했어요.';
      else if (s.reason === 'policy') reply = s.csCard.next;
      else reply = '답변을 확인하다가 문제가 생겨서 담당자에게 넘겼어요.';
    }
  }
  if (s.notice && s.route !== 'cs' && !s.csCard) reply = `${s.notice} ${reply}`;
  s = merge(s, { messages: [{ role: 'assistant', text: reply }] });
  // 이번 턴 논의에 턴 번호 표시
  s.discussion = s.discussion.map((m, i) => (i >= turnStart && m.turn == null ? { ...m, turn: s.turn } : m));
  s.reply = reply;
  return s;
}

/* ---------------- 데모 계정 (더미 데이터) ---------------- */
const dayISO = (offset) => new Date(Date.now() - offset * 864e5).toISOString().slice(0, 10);
const DEMO_ACCOUNTS = {
  minsu: { name: '민수', desc: '결제 완료, 출고 준비 중', orders: [
    { id: 'PR-0001', code: 'S-05', size: 265, status: '결제완료', ordered: 0, exchanges: 0 } ] },
  jiwoo: { name: '지우', desc: '배송 완료 3일째', orders: [
    { id: 'PR-0002', code: 'S-08', size: 270, status: '배송완료', ordered: 5, shipped: 4, delivered: 3, exchanges: 0 } ] },
  hyun: { name: '현', desc: '배송 완료 10일째, 교환 이력 1회', orders: [
    { id: 'PR-0003', code: 'S-01', size: 275, status: '배송완료', ordered: 14, shipped: 13, delivered: 10, exchanges: 1 } ] },
  seoyeon: { name: '서연', desc: '교환 진행 중 + 새 주문 배송 중', orders: [
    { id: 'PR-0005', code: 'S-10', size: 250, status: '배송중', ordered: 1, shipped: 0, exchanges: 0 },
    { id: 'PR-0004', code: 'S-09', size: 250, status: '교환 접수', ordered: 8, shipped: 7, delivered: 6, exchanges: 1, note: '255mm로 교환, 회수 기사님 방문 예정이에요.' } ] },
};

function makeAccount(id) {
  const a = DEMO_ACCOUNTS[id];
  if (!a) return null;
  return {
    id, name: a.name, desc: a.desc,
    orders: a.orders.map((o) => ({
      id: o.id, code: o.code, size: o.size, status: o.status, exchanges: o.exchanges, note: o.note || null,
      orderedAt: dayISO(o.ordered), shippedAt: o.shipped != null ? dayISO(o.shipped) : null, deliveredAt: o.delivered != null ? dayISO(o.delivered) : null,
    })),
  };
}

// 로그인·구매도 노드처럼 '바꿀 키만' 반환한다
function loginNode(state, rawId) {
  const account = makeAccount(String(rawId || '').trim().toLowerCase());
  return account ? { account, cs: { ...state.cs, waiting: false } } : null;
}

let ORDER_SEQ = 100;
function orderNode(state, code, size) {
  if (!state.account) return null;
  const o = { id: `PR-${String(++ORDER_SEQ).padStart(4, '0')}`, code, size, status: '결제완료', exchanges: 0, note: null, orderedAt: dayISO(0), shippedAt: null, deliveredAt: null };
  return { account: { ...state.account, orders: [o, ...state.account.orders] }, lastOrder: o };
}

/* ---------------- 서버 → 화면 응답 (내부 논의는 여기서 제거) ---------------- */
function toClient(s) {
  const turnDisc = s.discussion.filter((m) => m.turn === s.turn);
  return {
    stage: s.route,
    reason: s.reason,
    profile: s.profile,
    skipped: s.skipped,
    pool: s.pool,
    candidates: s.candidates,
    discussion: turnDisc.filter((m) => m.visibility === 'public').map(({ agent, text }) => ({ agent, text })),
    hiddenCount: turnDisc.filter((m) => m.visibility === 'internal').length,
    csCard: s.csCard,
    alts: s.alts,
    tradeoffs: s.tradeoffs || null,
    reply: s.reply,
    nextSlot: s.route === 'ask' && SLOT_LABEL[s.reason] ? s.reason : null,
    account: s.account ? { id: s.account.id, name: s.account.name, orders: s.account.orders.map((o) => ({ ...o, label: orderLabel(o) })) } : null,
  };
}

if (typeof module !== 'undefined') module.exports = { run, toClient, initialState, PRODUCTS, stockOf, filterProducts, extract, merge, buildExtractPrompt, normalizeLLM, loginNode, orderNode, DEMO_ACCOUNTS };

  }

  function cardHTML(code, i, c, changed) {
    const p = product(code);
    const alt = c && c.stage === 'alternative';
    const best = c && (c.stage === 'recommend' || alt) && i === 0;
    const pic = PHOTOS[code] ? `<img src="${PHOTOS[code]}" alt="${esc(p.name)}">` : shoeSVG(p);
    const prof = c ? c.profile : {};
    const why = whyKept(p, prof);
    const stock = '';
    const liked = prof.style && p.line === prof.style.line ? ` · ${prof.style.line} 선호` : '';
    return `<article class="card ${best ? 'best' : ''} ${changed ? 'enter' : ''}">
      ${best ? `<span class="best-label">${alt ? '가장 가까운 1켤레' : '먼저 신어볼 1켤레'}</span>` : ''}
      ${!best && c && c.stage === 'recommend' && c.tradeoffs && c.tradeoffs[code] ? '<span class="best-label" style="color:var(--muted)">대안</span>' : ''}
      <div class="shoe">${pic}</div>
      <div class="meta"><span class="stud">${p.stud}</span><span class="code">${STUD_INFO[p.stud]}</span></div>
      <div class="name">${esc(p.name)}</div>
      <div class="price">${fmtWon(p.price)}</div>
      ${c && ['recommend', 'alternative'].includes(c.stage) ? `<button class="buy" type="button" data-buy="${code}">구매하기</button>` : ''}
      ${c && c.tradeoffs && c.tradeoffs[code] ? `<div class="trade">${c.tradeoffs[code].length ? c.tradeoffs[code].map((t) => `<span>${esc(t)}</span>`).join('') : '<span>양보 없음</span>'}</div>` : `<div class="why">${esc(why)}${stock && !why.includes('재고') ? ' · ' + stock : ''}${liked}</div>`}
    </article>`;
  }

  function renderShelf(c) {
    const host = $('shelfHost');
    if (c && c.csCard) { host.innerHTML = newsHTML(c); $('count').textContent = '고객 문의 처리 과정'; return; }
    const codes = c ? c.candidates : ['S-04', 'S-08', 'S-02'];
    const changed = codes.join() !== lastCodes;
    lastCodes = codes.join();
    let html = codes.map((code, i) => cardHTML(code, i, c, changed)).join('');
    for (let i = codes.length; i < 3; i++) html += `<div class="card empty">${c && c.stage === 'escalate' && c.reason === 'empty' ? '조건에 맞는 재고가 없어요' : '조건을 통과한 신발은 여기까지예요'}</div>`;
    host.innerHTML = `<div class="shelf" id="shelf">${html}</div>`;
    const shelf = $('shelf');
    const prof = c ? c.profile : {};
    const filled = order.filter((k) => prof[k] != null || (c && c.skipped.includes(k))).length;
    const prog = c && (c.stage === 'recommend' || c.stage === 'alternative') ? 1 : filled / order.length;
    shelf.style.setProperty('--blur', `${(1 - prog) * 12}px`);
    shelf.style.setProperty('--dim', `${0.42 + prog * 0.58}`);
    shelf.style.setProperty('--sat', `${0.7 + prog * 0.3}`);
    shelf.classList.toggle('paused', !!(c && c.stage === 'escalate' && c.reason === 'health'));
    $('count').innerHTML = c && c.stage === 'alternative' ? '조건을 전부 맞추는 신발 0종 → <b>가장 가까운 3켤레</b>' : `전체 ${PRODUCTS.length}종 → <b>${c ? c.pool : PRODUCTS.length}종</b> 남음`;
  }

  function newsHTML(c) {
    const k = c.csCard;
    const disc = c.discussion.map((d) => `<li><span class="ag">${esc(d.agent)}</span>${esc(d.text)}</li>`).join('');
    const alts = k.options ? `<ul class="alt-list">${k.options.map((o) => `<li>${esc(o)}</li>`).join('')}</ul>` : '';
    return `<div class="news" role="group" aria-label="CS 카드뉴스">
      <section class="slide" data-s="1"><div class="step">문의 <em>1/4</em></div><h3>${esc(k.summary)}</h3></section>
      <section class="slide" data-s="2"><div class="step">에이전트 논의 <em>2/4</em></div><ul>${disc}</ul>${c.hiddenCount ? `<div class="locked">${LOCK}<span>내부 논의 ${c.hiddenCount}건 비공개</span></div>` : ''}</section>
      <section class="slide" data-s="3"><div class="step">적용 규칙 <em>3/4</em></div><ul>${k.rules.map((r) => `<li>${esc(r)}</li>`).join('')}</ul></section>
      <section class="slide" data-s="4"><div class="step">결론 <em>4/4</em></div><span class="verdict ${k.verdict === '사장님 확인' ? 'hold' : 'ok'}">${esc(k.verdict)}</span><p>${esc(k.next)}</p>${alts}</section>
    </div>`;
  }

  function renderSlots(c) {
    const prof = c ? c.profile : {};
    const cells = order.map((k) => {
      const v = prof[k];
      const skipped = c && c.skipped.includes(k);
      const text = v == null ? (skipped ? '건너뜀' : '—') : k === 'size' ? `${v}mm` : k === 'budget' ? (v === Infinity ? '상관없음' : `${Math.round(v / 10000)}만원 이하`) : v;
      return `<span data-k="${k}" class="${v != null ? 'on' : ''}"><i></i>${label[k]} <b>${text}</b></span>`;
    });
    if (prof.size) cells.push(`<span data-k="size" class="on"><i></i>사이즈 <b>${prof.size}mm</b></span>`);
    if (prof.style) cells.push(`<span data-k="style" class="on"><i></i>취향 <b>${esc(prof.style.line)}</b></span>`);
    $('slots').innerHTML = cells.join('');
  }

  function renderExtra(c) {
    let html = '';
    if (c && c.stage === 'escalate' && !c.csCard) {
      const health = c.reason === 'health';
      const alts = health ? ['피팅 전문가 상담 예약', '매장 방문 시착'] : (c.alts && c.alts.length ? c.alts : ['조건을 바꿔서 다시 찾기']);
      html = `<div class="handoff"><strong>${health ? '피팅 전문가에게 넘겼어요' : '사장님께 대안과 함께 넘겼어요'}</strong>
        <span>${health ? '발 건강은 AI가 판단하지 않아요. 평일 10:00–18:00에 순서대로 연락드려요.' : '조건을 모두 맞추는 신발이 없어서, 아래 대안을 붙여 전달했어요.'}</span>
        <ul class="alt-list">${alts.map((a) => `<li>${esc(a)}</li>`).join('')}</ul></div>`;
    }
    $('extra').innerHTML = html;
  }

  function renderDiscuss(c) {
    const box = $('discuss');
    if (!c || c.csCard || (!c.discussion.length && !c.hiddenCount)) { box.hidden = true; return; }
    box.hidden = false;
    box.open = false;
    $('discussSum').textContent = `에이전트 논의 보기 · 공개 ${c.discussion.length}건${c.hiddenCount ? ` · 비공개 ${c.hiddenCount}건` : ''}`;
    $('dlist').innerHTML = c.discussion.map((d) => `<li><span class="agent" data-a="${esc(d.agent)}">${esc(d.agent.replace(' 에이전트', ''))}</span><span>${esc(d.text)}</span></li>`).join('')
      + (c.hiddenCount ? `<li class="locked">${LOCK}<span>내부 논의 ${c.hiddenCount}건은 공개하지 않아요 (매입가·결재 기준 등)</span></li>` : '');
  }

  function renderBg(c) {
    const surf = c && c.profile.surface;
    const src = (surf && BG[surf]) || BG['기본'];
    const bg = $('bg');
    bg.style.backgroundImage = src ? `url("${src}")` : 'none';
    bg.classList.toggle('photo', !!src);
    $('stage').classList.toggle('has-photo', !!src);
  }

  function render(c, text) {
    const result = c && ['recommend', 'alternative', 'escalate', 'cs'].includes(c.stage);
    $('stage').classList.toggle('collect', !result);
    renderBg(c);
    renderShelf(c);
    renderSlots(c);
    renderExtra(c);
    renderDiscuss(c);
    const q = $('q');
    q.textContent = c ? c.reply : '어떤 구장에서 뛰세요?';
    q.classList.toggle('long', !!c && c.reply.length > 60);
    $('echo').hidden = !text;
    $('echo').textContent = text ? `“${text}”` : '';
    $('input').placeholder = c ? '여기에 답해 주세요' : '예: 흙운동장에서 뛰고, 호날두를 좋아해요';
  }

  /* ----- 이미 주문한 고객: 첫 화면이 내 CS 창으로 바뀐다 ----- */
  let mode = 'shop'; // 'shop' | 'service'
  const PRIORITY = (o) => (IN_SERVICE.includes(o.status) ? 0 : o.status === '배송중' ? 1 : o.status === '결제완료' ? 2 : 3);

  function serviceGreeting(a, os) {
    const sorted = [...os].sort((x, y) => PRIORITY(x) - PRIORITY(y) || Date.parse(y.orderedAt) - Date.parse(x.orderedAt));
    const o = sorted[0];
    let line;
    if (IN_SERVICE.includes(o.status)) line = o.status === '사장님 확인 중' ? `${o.label} 건은 사장님이 확인 중이에요.` : `${o.label} ${o.status === '교환 접수' ? '교환' : '반품'}이 진행 중이에요. ${o.note || ''}`;
    else if (o.status === '배송중') line = `${o.label}은 ${daysSince(o.shippedAt) === 0 ? '오늘' : daysSince(o.shippedAt) + '일 전'} 출고돼 배송 중이에요. 보통 1~2일 안에 도착해요.`;
    else if (o.status === '결제완료') line = `${o.label}은 결제 완료, 출고 준비 중이에요.`;
    else {
      const d = daysSince(o.deliveredAt);
      line = d <= POLICY.returnDays ? `${o.label} 받으신 지 ${d}일째예요. 사이즈나 착용감은 괜찮으세요? 교환은 ${POLICY.returnDays - d}일 안에 신청할 수 있어요.` : `${o.label} 받으신 지 ${d}일 지났어요.`;
    }
    const other = sorted.slice(1).find((x) => PRIORITY(x) < 3);
    const tail = other ? ` 다른 주문 ${other.id}는 ${other.status} 상태예요.` : '';
    return { text: `${a.name}님, ${line}${tail} 무엇을 도와드릴까요?`, primary: o.id, sorted };
  }

  function orderCardHTML(o, primary) {
    const p = product(o.code);
    const pic = PHOTOS[o.code] ? `<img src="${PHOTOS[o.code]}" alt="${esc(p.name)}">` : shoeSVG(p);
    const svc = !STEP.includes(o.status);
    const idx = svc ? 3 : STEP.indexOf(o.status);
    const steps = STEP.map((s, i) => `<span class="${i < idx ? 'done' : i === idx ? 'now' : ''}">${s}</span>`).join('') + (svc ? `<span class="svc">${esc(o.status)}</span>` : '');
    const date = o.deliveredAt ? `배송 완료 ${o.deliveredAt}` : o.shippedAt ? `출고 ${o.shippedAt}` : `주문 ${o.orderedAt}`;
    return `<article class="card ${primary ? 'best' : ''} enter">${primary ? '<span class="best-label">지금 볼 주문</span>' : ''}
      <div class="shoe">${pic}</div>
      <div class="meta"><span class="stud">${p.stud}</span><span class="code">${o.id} · ${o.size}mm</span></div>
      <div class="name">${esc(p.name)}</div>
      <div class="steps">${steps}</div>
      <div class="order-note">${date}${o.exchanges ? ` · 교환 ${o.exchanges}회` : ''}${o.note ? '<br>' + esc(o.note) : ''}</div>
    </article>`;
  }

  function renderService() {
    mode = 'service';
    const a = state.account;
    const os = toClient(state).account.orders;
    const g = serviceGreeting(a, os);
    $('stage').classList.remove('collect');
    renderBg(null);
    $('count').innerHTML = `${esc(a.name)}님 주문 <b>${os.length}건</b>`;
    const cards = g.sorted.slice(0, 3).map((o) => orderCardHTML(o, o.id === g.primary)).join('');
    $('shelfHost').innerHTML = `<div class="shelf" style="--blur:0px;--dim:1;--sat:1">${cards}</div>`;
    $('slots').innerHTML = '';
    $('discuss').hidden = true;
    $('echo').hidden = true;
    $('extra').innerHTML = '<button class="switch" type="button" data-act="shop">새 축구화 찾기</button>';
    const q = $('q');
    q.textContent = g.text;
    q.classList.add('long');
    $('input').placeholder = '교환, 반품, 배송… 무엇이든 말씀해 주세요';
  }

  function home() {
    if (state.account && state.account.orders.length) renderService();
    else { mode = 'shop'; render(null, ''); }
  }

  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true;
    $('send').setAttribute('aria-busy', 'true');
    $('q').classList.remove('long');
    $('q').textContent = '문장을 이해하는 중…';
    const llm = await understand(text);          // ① Claude가 문장에서 정보만 뽑는다
    $('q').textContent = '에이전트들이 논의하는 중…';
    state = run(state, text, llm);               // ② 판단은 규칙 그래프가 한다
    const c = toClient(state);                   // ③ 화면은 이 JSON만 받는다
    render(c, text);
    if (panelMode === 'orders') renderPanel();
    renderWho();
    busy = false;
    $('send').removeAttribute('aria-busy');
    $('input').focus({ preventScroll: true });
  }

  /* ----- 로그인 · 내 주문 ----- */
  let panelMode = null; // 'login' | 'orders' | null
  let lastClient = null;
  const STEP = ['결제완료', '배송중', '배송완료'];

  function orderHTML(o) {
    const p = product(o.code);
    const pic = PHOTOS[o.code] ? `<img src="${PHOTOS[o.code]}" alt="">` : shoeSVG(p);
    const svc = !STEP.includes(o.status);
    const idx = svc ? 3 : STEP.indexOf(o.status);
    const steps = STEP.map((s, i) => `<span class="${i < idx ? 'done' : i === idx ? 'now' : ''}">${s}</span>`).join('') + (svc ? `<span class="svc">${esc(o.status)}</span>` : '');
    const date = o.deliveredAt ? `배송 완료 ${o.deliveredAt}` : o.shippedAt ? `출고 ${o.shippedAt}` : `주문 ${o.orderedAt}`;
    return `<div class="order"><div class="thumb">${pic}</div><div class="info"><b>${esc(o.label)}</b><span>${o.id} · ${date}${o.exchanges ? ` · 교환 ${o.exchanges}회` : ''}</span><div class="steps">${steps}</div>${o.note ? `<span>${esc(o.note)}</span>` : ''}</div></div>`;
  }

  function renderWho() {
    const a = state.account;
    $('who').innerHTML = a
      ? `<span class="me">${esc(a.name)}님</span><button class="pill-btn" type="button" data-act="orders">내 주문 ${a.orders.length}</button><button class="pill-btn" type="button" data-act="logout">로그아웃</button><button class="reset" type="button" data-act="reset">처음부터</button>`
      : `<button class="pill-btn dark" type="button" data-act="login">로그인</button><button class="reset" type="button" data-act="reset">처음부터</button>`;
  }

  function renderPanel(msg) {
    const panel = $('panel');
    if (panelMode === 'login' && !state.account) {
      const rows = Object.entries(DEMO_ACCOUNTS).map(([id, a]) => `<tr><td>${id}</td><td>${esc(a.desc)}</td></tr>`).join('');
      panel.innerHTML = `<h2>데모 로그인</h2><p>${msg ? esc(msg) + ' ' : ''}아이디만 입력하면 돼요. 비밀번호는 없어요.</p>
        <form class="login-row" id="loginForm" autocomplete="off"><input id="loginId" type="text" placeholder="아이디 (예: jiwoo)" aria-label="아이디"><button class="pill-btn dark" type="submit">로그인</button></form>
        <p id="loginErr" hidden>없는 아이디예요. 아래 데모 계정 중 하나를 입력해 주세요.</p>
        <table class="demo-ids"><tbody>${rows}</tbody></table>`;
      panel.hidden = false;
      $('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const upd = loginNode(state, $('loginId').value);
        if (!upd) { $('loginErr').hidden = false; return; }
        state = merge(state, upd);
        panelMode = null;
        renderWho(); renderPanel();
        if (pendingBuy) { const code = pendingBuy; pendingBuy = null; openSheet(code); }
        else { state = merge(initialState(), { account: state.account }); lastCodes = ''; home(); }
      });
      $('loginId').focus();
    } else if (panelMode === 'orders' && state.account) {
      const a = state.account;
      const view = toClient(state).account;
      panel.innerHTML = `<h2>${esc(a.name)}님 주문 ${a.orders.length}건</h2><p>배송·교환·반품을 물어보면 이 주문 기록으로 바로 판단해요.</p><div class="orders">${view.orders.map(orderHTML).join('')}</div>`;
      panel.hidden = false;
    } else {
      panel.hidden = true;
    }
  }

  /* ----- 구매 ----- */
  let pendingBuy = null;
  function openSheet(code) {
    const p = product(code);
    const size = state.profile.size || 270;
    const opts = SIZES.map((z) => `<option value="${z}" ${z === size ? 'selected' : ''}>${z}mm</option>`).join('');
    $('extra').innerHTML = `<form class="sheet" id="sheet"><strong>${esc(p.name)} ${p.stud} · ${fmtWon(p.price)}</strong><label>사이즈 <select id="buySize">${opts}</select></label><button class="buy" type="submit">주문하기 (데모 결제)</button></form>`;
    $('sheet').addEventListener('submit', (e) => {
      e.preventDefault();
      const upd = orderNode(state, code, Number($('buySize').value));
      state = merge(state, { account: upd.account });
      $('extra').innerHTML = '';
      $('q').textContent = `주문했어요. ${upd.lastOrder.id} · ${p.name} ${p.stud} ${upd.lastOrder.size}mm, 지금은 결제 완료 상태예요.`;
      $('q').classList.add('long');
      panelMode = 'orders';
      renderWho(); renderPanel();
      $('panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (b) {
      const act = b.dataset.act;
      if (act === 'login') { panelMode = panelMode === 'login' ? null : 'login'; renderPanel(); }
      if (act === 'orders') { panelMode = panelMode === 'orders' ? null : 'orders'; renderPanel(); }
      if (act === 'logout') { state = merge(initialState(), { account: null }); panelMode = null; lastCodes = ''; renderWho(); renderPanel(); home(); }
      if (act === 'reset') { const acc = state.account; state = merge(initialState(), { account: acc }); lastCodes = ''; home(); }
      if (act === 'shop') { mode = 'shop'; lastCodes = ''; render(null, ''); }
      return;
    }
    const buy = e.target.closest('[data-buy]');
    if (buy) {
      if (!state.account) { pendingBuy = buy.dataset.buy; panelMode = 'login'; renderPanel('구매하려면 로그인해 주세요.'); $('panel').scrollIntoView({ behavior: 'smooth' }); return; }
      openSheet(buy.dataset.buy);
    }
  });

  /* ----- 문장 이해: Claude (없으면 키워드 규칙) ----- */
  let samplePromise = (window.claude && window.claude.use)
    ? Promise.race([window.claude.use('sample'), new Promise((r) => setTimeout(() => r(null), 4000))]).catch(() => null)
    : Promise.resolve(null);
  let sampleFn = undefined;
  samplePromise.then((f) => { sampleFn = f; $('mode').textContent = f ? 'Claude' : '키워드 규칙 (Claude 연결 안 됨)'; });
  const PERMANENT = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired'];

  async function understand(text) {
    if (sampleFn === undefined) sampleFn = await samplePromise;
    if (!sampleFn) return null;
    try {
      const raw = await sampleFn.json(buildExtractPrompt(state, text), { modelTier: 'quick' });
      return normalizeLLM(raw);
    } catch (err) {
      if (err && PERMANENT.includes(err.code)) { sampleFn = null; $('mode').textContent = '키워드 규칙 (Claude 사용 안 함)'; }
      return null;
    }
  }

  $('form').addEventListener('submit', (e) => { e.preventDefault(); const v = $('input').value; $('input').value = ''; send(v); });
  renderWho();
  home();
})();
</script>
